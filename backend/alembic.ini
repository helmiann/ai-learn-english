# ============================================================
#  ENGLISH GRAMMAR CHATBOT — Alembic Configuration
#  File: backend/alembic.ini
# ============================================================

[alembic]
# Path ke folder migrations
script_location = db/migrations

# Format nama file migration
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone untuk nama file
timezone = Asia/Jakarta

# Truncate panjang slug
truncate_slug_length = 40

# URL database — akan di-override oleh env.py yang baca dari .env
sqlalchemy.url = postgresql+asyncpg://user:pass@localhost/dbname


# ----------------------------------------------------------
# LOGGING
# ----------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
