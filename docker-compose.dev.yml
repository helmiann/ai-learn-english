# ============================================================
#  ENGLISH GRAMMAR CHATBOT — Docker Compose (Development)
#  Jalankan: docker-compose -f docker-compose.dev.yml up --build
#
#  Perbedaan dari production:
#  - Port backend & frontend terbuka langsung (tanpa Nginx)
#  - Hot reload aktif di backend (volume mount source code)
#  - Frontend dev server (Vite/webpack) bukan static build
#  - Tidak ada Nginx container
# ============================================================

version: "3.9"

services:

  # ----------------------------------------------------------
  # DATABASE — PostgreSQL
  # ----------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: grammar_chatbot_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-grammar_chatbot_dev}
    ports:
      - "5432:5432"       # Buka ke host agar bisa diakses pgAdmin4
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - dev_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # CACHE — Redis
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: grammar_chatbot_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"       # Buka ke host untuk debugging
    volumes:
      - redis_dev_data:/data
    networks:
      - dev_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # BACKEND — FastAPI dengan hot reload
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development       # Multi-stage build target
    container_name: grammar_chatbot_backend_dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
      APP_ENV: development
    volumes:
      - ./backend:/app          # Mount source code untuk hot reload
      - ./logs/app:/app/logs
    ports:
      - "8000:8000"             # Akses langsung tanpa Nginx
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dev_network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ----------------------------------------------------------
  # FRONTEND — Dev server (Vite hot reload)
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development       # Multi-stage build target
    container_name: grammar_chatbot_frontend_dev
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend/src:/app/src       # Mount src untuk hot reload
      - ./frontend/public:/app/public
    ports:
      - "5173:5173"             # Port Vite dev server
    networks:
      - dev_network
    command: npm run dev -- --host 0.0.0.0

# ----------------------------------------------------------
# VOLUMES
# ----------------------------------------------------------
volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local

# ----------------------------------------------------------
# NETWORKS
# ----------------------------------------------------------
networks:
  dev_network:
    driver: bridge