# ============================================================
#  ENGLISH GRAMMAR CHATBOT — Docker Compose (Production)
#  Jalankan: docker-compose up --build
# ============================================================

version: "3.9"

services:

  # ----------------------------------------------------------
  # DATABASE — PostgreSQL
  # ----------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: grammar_chatbot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # CACHE — Redis
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: grammar_chatbot_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # BACKEND — FastAPI
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grammar_chatbot_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - ./logs/app:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_network
      - frontend_network
    expose:
      - "8000"

  # ----------------------------------------------------------
  # FRONTEND — React/Vue (static build)
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: grammar_chatbot_frontend
    restart: unless-stopped
    networks:
      - frontend_network
    expose:
      - "80"

  # ----------------------------------------------------------
  # WEB SERVER — Nginx (reverse proxy)
  # ----------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: grammar_chatbot_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - frontend_network

# ----------------------------------------------------------
# VOLUMES
# ----------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ----------------------------------------------------------
# NETWORKS
# ----------------------------------------------------------
networks:
  backend_network:
    driver: bridge
  frontend_network:
    driver: bridge